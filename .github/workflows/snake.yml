name: contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake, light and dark
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Put the hash back on the hex colors
        run: |
          # snk writes custom colors into the stylesheet with the leading "#"
          # stripped, so `fill: var(--c1)` is an invalid CSS color and SVG falls
          # back to black. Restore it. --cb already carries its own hash and an
          # 8-digit value, so the 6-digit pattern leaves it alone.
          # snk runs in a container as root, so dist/ is root-owned.
          sudo chown -R "$USER" dist
          sed -i -E 's/--(c[a-z0-9]+):([0-9A-Fa-f]{6})/--\1:#\2/g' dist/*.svg
          grep -o -- '--c[a-z0-9]*:#\?[0-9A-Fa-f]*' dist/snake.svg | head

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
