name: contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake, light and dark
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23172B35&color_dots=%23F4F6F5,%23C7DDE2,%236F9EAA,%2343646F,%23172B35
            dist/snake-dark.svg?color_snake=%23C7DDE2&color_dots=%23161B22,%23172B35,%2343646F,%236F9EAA,%23C7DDE2

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
